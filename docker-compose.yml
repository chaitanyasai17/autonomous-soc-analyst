# ==============================================================================
# Autonomous SOC Analyst — Production Docker Compose Orchestration
# Services: PostgreSQL, FastAPI Backend, React Frontend, Nginx Reverse Proxy
# ==============================================================================

version: "3.9"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: asoc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: asoc_db
      POSTGRES_USER: asoc_user
      POSTGRES_PASSWORD: asoc_secure_password_123!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asoc_user -d asoc_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - asoc-network

  # ----------------------------------------------------------------------------
  # FastAPI Application Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: asoc_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      APP_NAME: "Autonomous SOC Analyst"
      SECRET_KEY: "prod-secret-key-change-in-real-deployment-replace-me"
      DATABASE_URL: "postgresql://asoc_user:asoc_secure_password_123!@postgres:5432/asoc_db"
      AI_PROVIDER: "heuristic"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      LOG_LEVEL: "INFO"
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - asoc-network

  # ----------------------------------------------------------------------------
  # React + Vite Frontend Application Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: asoc_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - asoc-network

  # ----------------------------------------------------------------------------
  # Edge Reverse Proxy (Nginx)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: asoc_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - asoc-network

networks:
  asoc-network:
    driver: bridge

volumes:
  postgres_data:
  storage_data:
