[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path additions (repo root already on path via app package)
prepend_sys_path = .

# Timezone for revision timestamps
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# version path separator
version_path_separator = os

# Actual DB URL is injected at runtime from Settings inside migrations/env.py —
# this placeholder is never used directly, avoiding a second source of truth.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Formatting hooks can be enabled later (e.g., black) once dependencies are installed.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
