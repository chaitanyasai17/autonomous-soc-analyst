id: c3d4e5f6-a7b8-4c9d-8e0f-1a2b3c4d5e6f
title: Suspicious Command Execution via LOLBins
description: >
  Detects execution of legitimate system binaries in patterns commonly
  abused to proxy execution or evade detection ("living off the land"
  binaries), including certutil, rundll32, wmic, and bitsadmin abuse.
author: ASOC Security Team
date: 2026/01/10
modified: 2026/01/10
status: stable
level: medium
enabled: true
tags:
  - attack.execution
  - attack.defense_evasion
  - attack.t1218
logsource:
  category: endpoint
detection:
  selection:
    message|contains:
      - 'cmd.exe /c'
      - 'wmic process call create'
      - 'certutil -decode'
      - 'certutil -urlcache'
      - 'bitsadmin /transfer'
      - 'rundll32.exe'
      - 'regsvr32 /s /u /i:'
  condition: selection
fields:
  - hostname
  - username
  - message
falsepositives:
  - Legitimate software deployment scripts using certutil for certificate management
  - System administration scripts using wmic for authorized remote process creation
references:
  - https://attack.mitre.org/techniques/T1218/
  - https://lolbas-project.github.io/
