id: 9d0e1f2a-3b4c-4d5e-8f60-7a8b9c0d1e2f
title: Credential Dumping Tool Indicators
description: >
  Detects command-line or log indicators associated with well-known
  credential-dumping tools and techniques (Mimikatz, LSASS memory access,
  SAM/NTDS extraction).
author: ASOC Security Team
date: 2026/01/10
modified: 2026/01/10
status: stable
level: critical
enabled: true
tags:
  - attack.credential_access
  - attack.t1003
logsource:
  category: endpoint
detection:
  selection:
    message|contains:
      - 'mimikatz'
      - 'sekurlsa'
      - 'lsadump'
      - 'procdump lsass'
      - 'dump credentials'
      - 'ntds.dit'
      - 'reg save hklm\\sam'
  condition: selection
fields:
  - hostname
  - username
  - message
falsepositives:
  - Authorized security tooling (EDR/forensics) performing memory analysis
  - Approved penetration testing engagements
references:
  - https://attack.mitre.org/techniques/T1003/
